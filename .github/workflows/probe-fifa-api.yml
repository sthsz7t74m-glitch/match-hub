name: Probe FIFA ranking endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-fifa-api.mjs'
      - '.github/workflows/probe-fifa-api.yml'

permissions:
  contents: write

concurrency:
  group: fifa-ranking-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-fifa-api.mjs
      - name: Commit probe output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fifa-probe.json
          git commit -m 'debug: record FIFA endpoint probe' || exit 0
          git push
