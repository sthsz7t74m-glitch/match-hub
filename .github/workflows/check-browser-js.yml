name: Check browser JavaScript

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/js/match-components.js'
      - 'national.js'
      - 'national-detail.js'
      - '.github/workflows/check-browser-js.yml'

permissions:
  contents: write

concurrency:
  group: browser-js-syntax
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check shared sports card engine
        run: node --check assets/js/match-components.js

      - name: Check National Hub
        run: node --check national.js

      - name: Check national team detail
        run: node --check national-detail.js

      - name: Record successful check
        shell: bash
        run: |
          mkdir -p data
          printf '{"checkedAt":"%s","commit":"%s","files":["assets/js/match-components.js","national.js","national-detail.js"],"status":"passed"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > data/browser-js-check.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/browser-js-check.json
          git commit -m 'ci: record browser JavaScript syntax check' || exit 0
          git push
