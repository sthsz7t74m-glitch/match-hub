name: Update FIFA rankings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/update-fifa-rankings.mjs'
      - '.github/workflows/update-fifa-rankings.yml'

permissions:
  contents: write

concurrency:
  group: fifa-rankings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official FIFA ranking
        shell: bash
        run: |
          set -o pipefail
          node scripts/update-fifa-rankings.mjs 2>&1 | tee data/fifa-ranking-update.log

      - name: Commit ranking changes
        run: |
          if git diff --quiet -- data/fifa-rankings.json data/fifa-ranking-update.log; then
            echo 'FIFA ranking is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fifa-rankings.json data/fifa-ranking-update.log
          git commit -m 'data: update FIFA men ranking'
          git push
