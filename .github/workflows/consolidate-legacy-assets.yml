name: Consolidate legacy assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/consolidate-legacy-assets.mjs'
      - '.github/workflows/consolidate-legacy-assets.yml'

permissions:
  contents: write

concurrency:
  group: match-hub-maintenance
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build consolidated assets
        run: node scripts/consolidate-legacy-assets.mjs
      - name: Verify references
        run: |
          test -f legacy-features.css
          test -f legacy-features.js
          ! grep -Eq 'v0(5|51|64|65|70|72|80|90)|v10[0-3]' index.html
      - name: Commit consolidated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: consolidate legacy CSS and JS assets"
          git pull --rebase origin main
          git push origin HEAD:main
