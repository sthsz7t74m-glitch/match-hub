name: Update J League data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-jleague.mjs'
      - 'package.json'
      - '.github/workflows/update-jleague-data.yml'
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: write

concurrency:
  group: match-hub-data-writes
  cancel-in-progress: false

jobs:
  update-jleague:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch ESPN J League data
        run: npm run update-jleague
      - name: Show fetch summary
        run: |
          node -e "const d=require('./data/jleague.json'); console.log({source:d.dataSource, teams:d.teams?.length, matches:d.matches?.length, standings:d.standings?.length, errors:d.errors?.length})"
      - name: Commit and push J League data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jleague.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update J League data"
          git pull --rebase origin main
          git push origin HEAD:main
