name: Update J League data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-jleague.mjs'
      - 'scripts/merge-jleague-schedules.mjs'
      - 'assets/js/jleague-data.js'
      - 'package.json'
      - '.github/workflows/update-jleague-data.yml'
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: write

concurrency:
  group: match-hub-data-writes
  cancel-in-progress: false

jobs:
  update-jleague:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Validate J League fetchers
        run: |
          node --check scripts/fetch-jleague.mjs
          node --check scripts/merge-jleague-schedules.mjs
          node --check assets/js/jleague-data.js

      - name: Fetch ESPN and official J League data
        run: npm run update-jleague

      - name: Show fetch summary
        run: |
          node - <<'NODE'
          const data = require('./data/jleague.json');
          console.log({
            source: data.dataSource,
            season: data.season,
            teams: data.counts?.teams,
            matches: data.counts?.matches,
            standings: data.counts?.standings,
            officialLogos: data.counts?.officialLogos,
            officialVenues: data.counts?.officialVenues,
            errors: data.errors?.length
          });
          NODE

      - name: Commit and push J League data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jleague.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update J League data"
          git pull --rebase origin main
          git push origin HEAD:main
