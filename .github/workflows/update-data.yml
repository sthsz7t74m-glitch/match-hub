name: Update football data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-data.mjs'
      - 'scripts/fetch-jleague.mjs'
      - 'scripts/fetch-national-data.mjs'
      - 'package.json'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch football-data.org data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run update-data
      - name: Fetch J League data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run update-jleague
      - name: Fetch national team data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run update-national
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football.json data/jleague.json data/national-matches.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update football data"
          git push