name: Update football data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-data.mjs'
      - 'package.json'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

concurrency:
  group: match-hub-data-writes
  cancel-in-progress: false

jobs:
  update-football:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch football data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run update-data
      - name: Commit and push football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update football data"
          git pull --rebase origin main
          git push origin HEAD:main
