<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="5大リーグの推しクラブ日程と順位をまとめて確認できるMatch Hub">
  <title>Match Hub</title>
  <script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if('caches'in window)caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key)))).catch(()=>{});</script>

<body class="football-hub" data-hub="five">
<header class="topbar"><div><p class="eyebrow">FOOTBALL SCHEDULE</p><h1>Match Hub <span class="version">v1.0.7</span></h1></div><div style="display:flex;align-items:center;gap:8px"><a href="./sports-home.html" class="icon-button" aria-label="Sports Hubへ戻る" style="display:grid;place-items:center;text-decoration:none">🏟</a><button id="themeButton" class="icon-button" aria-label="テーマ切替">◐</button></div></header>
<main class="hub-main">
<section id="statusArea" class="status-card"><span id="updateStatus">データを確認中…</span><button id="refreshButton" class="text-button">最新情報に更新</button></section>
<section id="onboarding" class="panel hidden"><p class="step">STEP 1 / 1</p><h2>最推しクラブを選ぼう</h2><p class="muted">5大リーグから1クラブ選択。あとから好きなだけ追加できます。</p><div class="search-row"><input id="teamSearch" type="search" placeholder="カタカナ・英語でチーム名を検索"></div><div id="leagueFilters" class="chips"></div><div id="teamPicker" class="team-grid"></div></section>
<section id="homeView" class="hidden"><section id="dailyOverview" class="daily-overview"></section><section id="liveSection" class="hidden live-section"><div class="live-heading"><span class="live-dot"></span><div><p class="eyebrow">LIVE NOW</p><h2>ライブ中の試合</h2></div></div><div id="liveMatches" class="stack"></div></section><section id="favoriteHero" class="hero"></section><div class="section-heading"><div><h2>お気に入りクラブ</h2><p id="favoriteCount" class="muted"></p></div><button id="addTeamButton" class="text-button">＋ 追加</button></div><p class="reorder-help">↑ ↓ ボタンで並び替え</p><div id="favoriteTeams" class="stack"></div><section class="calendar-panel panel"><div class="calendar-head"><button id="calendarPrev" class="mini-button" aria-label="前の月">‹</button><h2 id="calendarTitle"></h2><button id="calendarNext" class="mini-button" aria-label="次の月">›</button><button id="calendarToday" class="mini-button calendar-today-button">今日へ戻る</button></div><div class="calendar-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="football-calendar"></div><div id="calendarMatches" class="stack calendar-matches"></div></section><div class="section-heading"><h2>試合日程</h2></div><div class="tabs"><button class="tab" data-range="today">今日</button><button class="tab active" data-range="week">今週</button><button class="tab" data-range="month">今月</button></div><div id="scheduleList" class="stack"></div></section>
<section id="teamDetailView" class="hidden"><button id="detailBackButton" class="back-button">← 戻る</button><section id="detailHeader" class="detail-header"></section><section class="panel detail-panel"><div class="section-heading compact"><div><h2>今シーズンの試合</h2><p id="detailMatchCount" class="muted"></p></div></div><div id="detailFilters" class="chips detail-filters"><button class="chip active" data-detail-filter="all">すべて</button><button class="chip" data-detail-filter="home">ホーム</button><button class="chip" data-detail-filter="away">アウェイ</button><button class="chip" data-detail-filter="upcoming">今後</button><button class="chip" data-detail-filter="finished">結果</button></div><div id="detailMatchList" class="stack"></div></section></section>
<section id="standingsView" class="hidden panel"><h2>順位表</h2><p class="muted">前回更新からの順位変動を表示します。</p><div id="standingsTabs" class="chips spaced-chips"></div><div id="standingsTable"></div></section><section id="searchView" class="hidden panel"><h2>チーム検索</h2><input id="globalTeamSearch" type="search" placeholder="カタカナ・英語・略称で検索"><div id="globalLeagueFilters" class="chips"></div><div class="search-tools"><span id="globalSearchCount" class="search-count">0クラブ</span><button id="favoritesOnlyToggle" class="filter-toggle">✓ 追加済みのみ</button></div><div id="globalTeamResults" class="team-grid"></div></section><section id="transfersView" class="hidden panel"><div class="transfer-title"><div><p class="eyebrow">TRANSFER CENTER</p><h2>移籍情報</h2></div><span id="transferUpdated" class="muted"></span></div><div class="chips transfer-filters"><button class="chip active" data-transfer-filter="all">すべて</button><button class="chip" data-transfer-filter="official">正式</button><button class="chip" data-transfer-filter="agreed">合意</button><button class="chip" data-transfer-filter="talks">交渉中</button><button class="chip" data-transfer-filter="rumour">噂</button></div><div id="transferList" class="stack"></div></section><section id="settingsView" class="hidden panel"><h2>設定</h2><label class="setting-row"><span>ダークモード</span><input id="darkModeToggle" type="checkbox"></label><label class="setting-row"><span>英語名を表示</span><input id="showEnglishToggle" type="checkbox" checked></label><label class="setting-row"><span>表示密度</span><select id="densitySelect"><option value="standard">標準</option><option value="compact">コンパクト</option></select></label><button id="resetFavoriteOrder" class="secondary-button">お気に入り順を名前順に戻す</button><button id="resetButton" class="danger-button">お気に入り設定をリセット</button></section>
</main>
<nav id="pageTabs" class="bottom-nav" aria-label="メインメニュー"><button class="nav-item active" data-view="home">⌂<span>ホーム</span></button><button class="nav-item" data-view="schedule">▤<span>日程</span></button><button class="nav-item" data-view="standings">≡<span>順位表</span></button><button class="nav-item" data-view="search">⌕<span>検索</span></button><button class="nav-item" data-view="transfers">↔<span>移籍</span></button><button class="nav-item" data-view="settings">⚙<span>設定</span></button></nav>
<dialog id="scoreDialog"><div id="scoreDialogBody"></div><button id="closeScoreDialog" class="primary-button">閉じる</button></dialog>
<script src="./assets/js/match-components.js?v=107" defer></script><script src="./app.js?v=107" defer></script><script src="./jp-teams.js?v=107" defer></script><script src="./transfers.js?v=107" defer></script><script src="./v064.js?v=107" defer></script><script src="./v065.js?v=107" defer></script><script src="./v072.js?v=107" defer></script><script src="./v074.js?v=107" defer></script><script src="./v080.js?v=107" defer></script><script src="./v081.js?v=107" defer></script><script src="./v090.js?v=107" defer></script><script src="./v100.js?v=107" defer></script><script src="./v101.js?v=107" defer></script><script src="./assets/js/football-surface.js?v=1" defer></script>
</body></html>
