<header class="app-header"><a class="back-link" href="./sports-home.html" aria-label="Sports Hubへ戻る">←</a><div class="app-header__title"><p class="eyebrow">JAPAN PROFESSIONAL FOOTBALL</p><h1>Jリーグ <span class="version">v2.8.1</span></h1></div><button id="themeButton" class="icon-button" type="button" aria-label="テーマ切替">◐</button></header>
<main class="page">
<section class="j-hero panel"><div><p class="eyebrow">J LEAGUE HUB</p><h2>推しクラブをもっと近くに</h2><p class="muted">J1・J2・J3の全60クラブと、公開データから取得した日程・結果・順位・エンブレムを表示します。</p><small id="jUpdated" class="data-updated">データを確認中…</small></div><div class="j-mark" aria-hidden="true">🇯🇵</div></section>
<section class="panel"><div class="section-heading"><div><h2>リーグを選ぶ</h2><p class="muted">J1・J2・J3を切り替えます</p></div></div><div id="leagueTabs" class="chips" aria-label="Jリーグカテゴリー"></div></section>
<section class="panel"><div class="section-heading"><div><h2>クラブを探す</h2><p class="muted">クラブ名・地域名で検索</p></div><span id="clubCount" class="status">0クラブ</span></div><input id="clubSearch" class="search-input" type="search" placeholder="例：東京 / 横浜 / 浦和"><div id="clubGrid" class="club-grid"></div></section>
<section class="panel"><div class="section-heading"><div><h2>直近結果・今後の日程</h2><p class="muted">選択中リーグの直近4試合と次の8試合</p></div><span id="matchCount" class="status">取得中</span></div><div id="jleagueMatches" class="j-match-list"><div class="empty-state"><strong>試合データを取得中…</strong></div></div></section>
<section class="panel"><div class="section-heading"><div><h2>順位表</h2><p class="muted">選択中リーグの勝点・試合数・得失点差</p></div><span class="status">実データ</span></div><div id="jleagueStandings" class="j-standings"><div class="empty-state"><strong>順位データを取得中…</strong></div></div></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
