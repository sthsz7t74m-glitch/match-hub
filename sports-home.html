<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Sports Hub - 欧州サッカー、各国代表、Jリーグ、MLBをひとつにまとめるスポーツポータル">
  <title>Sports Hub</title>
  <link rel="stylesheet" href="./sports-home.css?v=210">
</head>
<body>
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>

  <header class="hub-header">
    <div>
      <p class="eyebrow">YOUR SPORTS, ONE PLACE</p>
      <h1>Sports Hub <span class="version">v2.1.0</span></h1>
      <p class="lead">好きなスポーツを、ひとつの場所で。</p>
    </div>
    <button id="themeButton" class="theme-button" type="button" aria-label="テーマ切替">◐</button>
  </header>

  <main class="hub-main">
    <section class="hero-card" aria-labelledby="heroTitle">
      <div>
        <p class="eyebrow">SPORTS DASHBOARD</p>
        <h2 id="heroTitle">今日は何を見る？</h2>
        <p>欧州5大リーグと各国代表が利用可能。Jリーグ、MLBも順次追加します。</p>
      </div>
      <div class="hero-ball" aria-hidden="true">🏟</div>
    </section>

    <section class="sport-grid" aria-label="スポーツ一覧">
      <a class="sport-card enabled" href="./index.html" data-sport="europe">
        <div class="sport-icon" aria-hidden="true">⚽</div>
        <div class="sport-copy">
          <div class="sport-title-row"><h2>欧州5大リーグ</h2><span class="status live">利用可能</span></div>
          <p>プレミア、ラ・リーガ、セリエA、ブンデス、リーグ・アン</p>
          <span class="open-label">Match Hubを開く <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <a class="sport-card enabled" href="./national.html" data-sport="national">
        <div class="sport-icon" aria-hidden="true">🌍</div>
        <div class="sport-copy">
          <div class="sport-title-row"><h2>各国代表</h2><span class="status live">NEW</span></div>
          <p>推し代表の登録、代表戦、大会情報の入口</p>
          <span class="open-label">National Hubを開く <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <button class="sport-card coming-soon" type="button" data-sport="jleague" aria-describedby="jleagueStatus">
        <div class="sport-icon" aria-hidden="true">🇯🇵</div>
        <div class="sport-copy">
          <div class="sport-title-row"><h2>Jリーグ</h2><span class="status soon">準備中</span></div>
          <p>J1・J2・J3の日程、順位、推しクラブをひとつに</p>
          <span id="jleagueStatus" class="open-label">近日追加予定</span>
        </div>
      </button>

      <button class="sport-card coming-soon" type="button" data-sport="mlb" aria-describedby="mlbStatus">
        <div class="sport-icon" aria-hidden="true">⚾</div>
        <div class="sport-copy">
          <div class="sport-title-row"><h2>MLB</h2><span class="status soon">準備中</span></div>
          <p>試合日程、順位、日本人選手の情報を見やすく整理</p>
          <span id="mlbStatus" class="open-label">近日追加予定</span>
        </div>
      </button>
    </section>

    <p class="hub-note">競技は今後も追加予定。Sports Hubはここから育てていきます。</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./sports-home.js?v=210" defer></script>
</body>
</html>
